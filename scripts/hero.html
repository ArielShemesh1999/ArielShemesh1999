<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0D1117; --ink:#F0F3F6; --muted:#8B949E; --accent:#C9A84C;
    --rule:rgba(201,168,76,.85); --hair:rgba(240,243,246,.08);
  }
  html.light{
    --bg:#FFFFFF; --ink:#0D1117; --muted:#57606A; --accent:#8A6D1F;
    --rule:rgba(138,109,31,.85); --hair:rgba(13,17,23,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:340px}
  body{
    background:transparent;
    font-family:system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-feature-settings:"kern" 1,"liga" 1;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;position:relative;
  }
  /* one soft accent bloom, bottom-right — the only non-type element */
  .bloom{
    position:absolute;right:-140px;bottom:-220px;width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle at center, var(--accent) 0%, transparent 62%);
    opacity:.11;filter:blur(3px);
  }
  html.light .bloom{opacity:.08}
  /* hairline grid, very faint */
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:linear-gradient(105deg,transparent 34%,#000 78%,transparent 99%),radial-gradient(120% 150% at 50% 50%,#000 55%,transparent 92%);
            mask-image:linear-gradient(105deg,transparent 34%,#000 78%,transparent 99%),radial-gradient(120% 150% at 50% 50%,#000 55%,transparent 92%);
    -webkit-mask-composite:source-in;mask-composite:intersect;
  }
  .wrap{position:relative;padding:54px 72px;height:100%;display:flex;flex-direction:column;justify-content:center}
  .wrap>*{flex:0 0 auto}
  .kicker{
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px;
  }
  h1{
    font-size:66px;line-height:1;letter-spacing:-.035em;font-weight:600;color:var(--ink);
  }
  .rule{width:64px;height:2px;background:var(--rule);margin:26px 0 22px;border-radius:2px}
  p{font-size:19px;line-height:1.5;color:var(--muted);max-width:720px;font-weight:400}
  p b{color:var(--ink);font-weight:550}
  .dot{color:var(--accent);padding:0 8px}
</style>
<div class="bloom"></div>
<div class="grid"></div>
<div class="wrap">
  <div class="kicker">Israel &nbsp;·&nbsp; AI &amp; product engineer</div>
  <h1>Ariel Shemesh</h1>
  <div class="rule"></div>
  <p><b>AI systems, software and digital experiences.</b><br>
     Agents that run on every major model<span class="dot">·</span>Hebrew RTL products, shipped end&#8209;to&#8209;end.</p>
</div>
