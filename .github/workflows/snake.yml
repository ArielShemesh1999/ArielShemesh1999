name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Two pushes in quick succession start two runs, and both force-push the
# same `output` branch. The loser fails on a non-fast-forward and turns the
# workflow red for a reason that has nothing to do with the profile.
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8A6D1F&color_dots=#EBEDF0,#EFE3BE,#DFC97E,#C9A84C,#8A6D1F
            dist/github-snake-dark.svg?color_snake=#C9A84C&color_dots=#161B22,#3B331C,#6B5A28,#A08340,#C9A84C

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
